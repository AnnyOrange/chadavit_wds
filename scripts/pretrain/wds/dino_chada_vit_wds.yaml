defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

# disable hydra outputs
hydra:
  output_subdir: null
  run:
    dir: .

name: "Dino-WDS-vit_c-Pretrain"
weights_init: "random-weights" # "random-weights" or "imagenet-weights"
method: "dino"
seed: 42

wandb:
  enabled: false
  project: "bioFMv2"
  entity: null
  offline: true

backbone:
  name: "vit_channels"
  kwargs:
    embed_dim: 192
    patch_size: 16
    return_all_tokens: False
    max_number_channels: 8

method_kwargs:
  proj_hidden_dim: 2048
  proj_output_dim: 256
  num_prototypes: 65536
  warmup_teacher_temperature_epochs: 50

momentum:
  base_tau: 0.9995
  final_tau: 1.0

data:
  dataset: "wds_packed_shards"
  train_path: "/mnt/huawei_deepcad/wds_packed_shards"
  val_path: "/mnt/huawei_deepcad/wds_packed_shards"
  format: "image_folder"
  num_workers: 8
  img_channels: 8
  max_img_channels: 8
  sample_ratio: 1.0

  # WDS-specific settings
  wds_train_pattern: "filtered_mixed_train_w00-*.tar"
  wds_val_pattern: "filtered_mixed_val_w00-*.tar"
  wds_channels: 8
  wds_min_channels: 1
  wds_require_all_channels: false
  wds_count_mode: "estimate"  # "estimate" or "exact"
  wds_estimate_n_shards: 2
  wds_estimated_samples: null

augmentations:
  - rrc:
      enabled: True
      crop_min_scale: 0.08
      crop_max_scale: 1.0
    color_jitter:
      prob: 0.8
      # multi-channel branch uses CustomColorJitter:
      int_min_shift: -0.3
      int_max_shift: 0.3
      gamma_min: 0.5
      gamma_max: 1.5
      # placeholders for torchvision branch compatibility
      brightness: 0.4
      contrast: 0.4
      saturation: 0.2
      hue: 0.1
    grayscale:
      prob: 0.0
    gaussian_blur:
      prob: 1.0
    solarization:
      prob: 0.0
    equalization:
      prob: 0.0
    horizontal_flip:
      prob: 0.5
    crop_size: 224
    num_crops: 1
    normalize:
      prob: 0.0

  - rrc:
      enabled: True
      crop_min_scale: 0.08
      crop_max_scale: 1.0
    color_jitter:
      prob: 0.8
      int_min_shift: -0.3
      int_max_shift: 0.3
      gamma_min: 0.5
      gamma_max: 1.5
      brightness: 0.4
      contrast: 0.4
      saturation: 0.2
      hue: 0.1
    grayscale:
      prob: 0.0
    gaussian_blur:
      prob: 0.1
    solarization:
      prob: 0.2
    equalization:
      prob: 0.0
    horizontal_flip:
      prob: 0.5
    crop_size: 224
    num_crops: 1
    normalize:
      prob: 0.0

optimizer:
  name: "lars"
  batch_size: 32
  lr: 0.3
  classifier_lr: 0.1
  weight_decay: 1e-6
  scale_lr_with_accum: false
  # Keep false unless you intentionally want LR multiplied by accumulate_grad_batches.
  allow_high_lr_with_accum: false
  kwargs:
    clip_lr: True
    eta: 0.02
    exclude_bias_n_norm: True

scheduler:
  name: "warmup_cosine"

checkpoint:
  enabled: true
  dir: "trained_models_full1TB_np65536_n1"
  frequency: 5
  keep_prev: true

auto_resume:
  enabled: true

channels_strategy: "multi_channels"
mixed_channels: false
ssl_val_loss: false

# overwrite PL stuff
max_epochs: 400
devices: [0,1,2,3,4,5,6,7]
sync_batchnorm: true
accelerator: "gpu"
strategy: "ddp"
# 全局 batch ≈ optimizer.batch_size × devices × accumulate_grad_batches；2048@32×8 卡 → 8
accumulate_grad_batches: 1
