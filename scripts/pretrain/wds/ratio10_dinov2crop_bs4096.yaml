defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .

name: "Dino-WDS-vit_c-Pretrain-ratio10-dinov2crop_bs4096"
weights_init: "random-weights"
method: "dino"
seed: 42

wandb:
  enabled: false
  project: "bioFMv2"
  entity: null
  offline: true

backbone:
  name: "vit_channels"
  kwargs:
    embed_dim: 192
    patch_size: 16
    return_all_tokens: false
    max_number_channels: 8

method_kwargs:
  proj_hidden_dim: 2048
  proj_output_dim: 256
  num_prototypes: 65536
  warmup_teacher_temperature_epochs: 50
  clip_grad: 0
  freeze_last_layer: 1
  norm_last_layer: true
  use_bn_in_head: false
  student_temperature: 0.1
  teacher_temperature: 0.07
  warmup_teacher_temperature: 0.04

momentum:
  base_tau: 0.9995
  final_tau: 1.0
  classifier: false

data:
  dataset: "wds_packed_shards"
  train_path: "/mnt/data/mae_semdedup_results/ratio_10.0"
  val_path: "/mnt/data/mae_semdedup_results/ratio_10.0"
  format: "image_folder"
  num_workers: 2
  img_channels: 8
  max_img_channels: 8
  num_large_crops: 2
  num_small_crops: 8
  sample_ratio: 1.0
  wds_train_pattern: "filtered_mixed_train_w*.tar"
  wds_val_pattern: "filtered_mixed_train_w*.tar"
  wds_channels: 8
  wds_min_channels: 1
  wds_require_all_channels: false
  wds_count_mode: "estimate"
  wds_estimate_n_shards: 2
  wds_estimated_samples: null
  no_labels: false
  fraction: -1
  num_classes: 1

augmentations:
  - rrc:
      enabled: true
      crop_min_scale: 0.32
      crop_max_scale: 1.0
    color_jitter:
      prob: 0.5
      int_min_shift: -0.1
      int_max_shift: 0.1
      gamma_min: 0.8
      gamma_max: 1.25
      brightness: 0.4
      contrast: 0.4
      saturation: 0.2
      hue: 0.1
    grayscale:
      prob: 0.0
    gaussian_blur:
      prob: 1.0
    solarization:
      prob: 0.0
    equalization:
      prob: 0.0
    horizontal_flip:
      prob: 0.5
    crop_size: 224
    num_crops: 1
    normalize:
      prob: 0.0
  - rrc:
      enabled: true
      crop_min_scale: 0.32
      crop_max_scale: 1.0
    color_jitter:
      prob: 0.5
      int_min_shift: -0.1
      int_max_shift: 0.1
      gamma_min: 0.8
      gamma_max: 1.25
      brightness: 0.4
      contrast: 0.4
      saturation: 0.2
      hue: 0.1
    grayscale:
      prob: 0.0
    gaussian_blur:
      prob: 0.1
    solarization:
      prob: 0.0
    equalization:
      prob: 0.0
    horizontal_flip:
      prob: 0.5
    crop_size: 224
    num_crops: 1
    normalize:
      prob: 0.0
  - rrc:
      enabled: true
      crop_min_scale: 0.05
      crop_max_scale: 0.32
    color_jitter:
      prob: 0.5
      int_min_shift: -0.1
      int_max_shift: 0.1
      gamma_min: 0.8
      gamma_max: 1.25
      brightness: 0.4
      contrast: 0.4
      saturation: 0.2
      hue: 0.1
    grayscale:
      prob: 0.0
    gaussian_blur:
      prob: 0.5
    solarization:
      prob: 0.0
    equalization:
      prob: 0.0
    horizontal_flip:
      prob: 0.5
    crop_size: 96
    num_crops: 8
    normalize:
      prob: 0.0

optimizer:
  name: "lars"
  batch_size: 16
  lr: 0.15
  classifier_lr: 0.05
  weight_decay: 1e-6
  scale_lr_with_accum: false
  allow_high_lr_with_accum: false
  kwargs:
    clip_lr: true
    eta: 0.02
    exclude_bias_n_norm: true
    momentum: 0.9
  token_learner_lr: null
  exclude_bias_n_norm_wd: false

scheduler:
  name: "warmup_cosine"
  lr_decay_steps: null
  min_lr: 0.0
  warmup_start_lr: 3e-5
  warmup_epochs: 10
  interval: "step"

checkpoint:
  enabled: true
  dir: "trained_models_ratio10_dinov2crop_bs4096"
  frequency: 5
  keep_prev: true

auto_resume:
  enabled: false
  max_hours: 36

channels_strategy: "multi_channels"
mixed_channels: false
ssl_val_loss: false
max_epochs: 400
devices: [0, 1, 2, 3, 4, 5, 6, 7]
sync_batchnorm: true
accelerator: "gpu"
strategy: "ddp"
accumulate_grad_batches: 32
debug: false

slurm:
  enabled: false
  num_nodes: 1
  num_jobs_per_node: 1
  num_cpus_per_job: 1
  gpus_type: "gpu:V100"

dali:
  device: "gpu"
  encode_indexes_into_labels: false

auto_umap:
  enabled: false
  dir: "auto_umap"
  frequency: 1

debug_augmentations: false
resume_from_checkpoint: null
num_nodes: 1

knn_eval:
  enabled: false
  k: 20
  distance_func: "euclidean"

performance:
  disable_channel_last: true
